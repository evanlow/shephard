<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shepherd — Access Denied</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif; background: #f4f6f9;
      display: flex; align-items: center; justify-content: center; min-height: 100vh;
    }
    .card {
      background: #fff; border-radius: 8px; padding: 2.5rem 2rem;
      box-shadow: 0 2px 12px rgba(0,0,0,.1); text-align: center; max-width: 360px;
    }
    h1 { font-size: 1.4rem; color: #b91c1c; margin-bottom: 0.5rem; }
    p { color: #6b7280; font-size: 0.9rem; margin-bottom: 1.5rem; }
    a { color: #4f46e5; font-weight: 600; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>403 — Access Denied</h1>
    <p>You don't have permission to access this page. Please contact your system administrator.</p>
    <a href="{{ url_for('auth.dashboard') }}">&larr; Back to Dashboard</a>
  </div>
</body>
</html>
