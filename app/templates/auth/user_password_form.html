<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shepherd — Set Password</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: #f4f6f9;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0,0,0,.1);
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 440px;
    }
    h1 { font-size: 1.5rem; margin-bottom: 0.25rem; color: #1a1a2e; }
    .subtitle { font-size: 0.875rem; color: #6b7280; margin-bottom: 1.75rem; }
    label { display: block; font-size: 0.875rem; font-weight: 500; color: #374151; margin-bottom: 0.35rem; }
    input[type="password"] {
      width: 100%;
      padding: 0.55rem 0.75rem;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 1rem;
      outline: none;
      transition: border-color .15s;
    }
    input:focus { border-color: #4f46e5; box-shadow: 0 0 0 3px rgba(79,70,229,.15); }
    .field { margin-bottom: 1.1rem; }
    .actions {
      display: flex;
      gap: 0.75rem;
      margin-top: 1.5rem;
    }
    button[type="submit"] {
      flex: 1;
      padding: 0.65rem;
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s;
    }
    button[type="submit"]:hover { background: #4338ca; }
    a.btn-cancel {
      flex: 1;
      padding: 0.65rem;
      background: #f3f4f6;
      color: #374151;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      transition: background .15s;
    }
    a.btn-cancel:hover { background: #e5e7eb; }
    .alerts { margin-bottom: 1rem; }
    .alert-error {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #b91c1c;
      border-radius: 6px;
      padding: 0.6rem 0.9rem;
      font-size: 0.875rem;
      margin-bottom: 0.5rem;
    }
    .hint { font-size: 0.75rem; color: #9ca3af; margin-top: 0.25rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Set Password</h1>
    <p class="subtitle">Set a new password for <strong>{{ target_user.username }}</strong>.</p>

    {% with messages = get_flashed_messages(category_filter=['error']) %}
      {% if messages %}
      <div class="alerts">
        {% for msg in messages %}
        <div class="alert-error">{{ msg }}</div>
        {% endfor %}
      </div>
      {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('auth.set_user_password', user_id=target_user.id) }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
      <div class="field">
        <label for="password">New Password</label>
        <input
          type="password"
          id="password"
          name="password"
          required
          autocomplete="new-password"
          minlength="8"
        />
        <p class="hint">Minimum 8 characters.</p>
      </div>

      <div class="field">
        <label for="confirm_password">Confirm Password</label>
        <input
          type="password"
          id="confirm_password"
          name="confirm_password"
          required
          autocomplete="new-password"
          minlength="8"
        />
      </div>

      <div class="actions">
        <a href="{{ url_for('auth.list_users') }}" class="btn-cancel">Cancel</a>
        <button type="submit">Set Password</button>
      </div>
    </form>
  </div>
</body>
</html>
