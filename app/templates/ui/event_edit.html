{% extends "ui/base.html" %}

{% block title %}Edit Event{% endblock %}
{% block nav_events %}active{% endblock %}

{% block content %}
<div class="mb-4">
  <a href="{{ url_for('ui.events') }}" class="text-decoration-none">&larr; Back to Events</a>
</div>

<div class="card" style="max-width: 560px;">
  <div class="card-header">
    <h5 class="mb-0">Edit Event</h5>
  </div>
  <div class="card-body">
    <form method="post" action="{{ url_for('ui.update_event', event_id=event.id) }}">
      <div class="mb-3">
        <label class="form-label">Event Name <span class="text-danger">*</span></label>
        <input type="text" name="name" class="form-control" value="{{ event.name }}" required />
      </div>
      <div class="mb-3">
        <label class="form-label">Date &amp; Time <span class="text-danger">*</span></label>
        <input type="datetime-local" name="date" class="form-control"
               value="{{ event.date.strftime('%Y-%m-%dT%H:%M') }}" required />
      </div>
      <div class="mb-4">
        <label class="form-label">Group</label>
        <input type="text" class="form-control"
               value="{{ event.group.name if event.group else '—' }}" disabled />
        <div class="form-text text-muted">Group cannot be changed after creation.</div>
      </div>
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary">Save Changes</button>
        <a href="{{ url_for('ui.events') }}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
