{% extends "ui/base.html" %}

{% block title %}Edit Group{% endblock %}
{% block nav_groups %}active{% endblock %}

{% block content %}
<div class="mb-4">
  <a href="{{ url_for('ui.groups') }}" class="text-decoration-none">&larr; Back to Groups</a>
</div>

<div class="card" style="max-width: 480px;">
  <div class="card-header">
    <h5 class="mb-0">Rename Group</h5>
  </div>
  <div class="card-body">
    <form method="post" action="{{ url_for('ui.update_group', group_id=group.id) }}">
      <div class="mb-3">
        <label class="form-label">Group Name <span class="text-danger">*</span></label>
        <input type="text" name="name" class="form-control" value="{{ group.name }}" required />
      </div>
      <div class="mb-4">
        <label class="form-label">Description</label>
        <input type="text" name="description" class="form-control"
               value="{{ group.description or '' }}" placeholder="Optional" />
      </div>
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary">Save Changes</button>
        <a href="{{ url_for('ui.groups') }}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
